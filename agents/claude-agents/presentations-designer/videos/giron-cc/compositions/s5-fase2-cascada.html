      <script>
        const tl = gsap.timeline({ paused: true });
        const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

        // Transición de entrada: zoom con desenfoque desde el frente
        tl.fromTo("#s5-in", { scale: 1.3, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0);

        // Titular por palabras y numeral fantasma
        tl.fromTo("#s5-root .h2 .w", { yPercent: 115 }, { yPercent: 0, duration: 0.8, stagger: 0.1, ease: "power4.out" }, 0.35);
        tl.fromTo("#s5-root .ghost", { opacity: 0, x: 60 }, { opacity: 0.07, x: 0, duration: 1.2, ease: "power2.out" }, 0.4);

        // Cascada: WhatsApp → Correo → Llamada, cada chip aparece en secuencia
        tl.fromTo("#s5-root .flow", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, stagger: 0.15, ease: "back.out(2)" }, 0.8);

        // Flechas que se dibujan y un punto que viaja por cada una
        tl.fromTo("#s5-root .arw", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, stagger: 0.2, ease: "power2.out" }, 1.3);
        tl.fromTo("#s5-root .pulse", { x: 0, opacity: 0 }, { x: 80, opacity: 1, duration: 0.6, stagger: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.0);

        // Contador: 0 → 1.000 llamadas diarias
        const cu = { v: 0 };
        tl.fromTo("#s5-root .goal", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 1.6);
        tl.fromTo(cu, { v: 0 }, { v: 1000, duration: 1.6, ease: "power2.out", onUpdate: () => { document.getElementById("s5-num").textContent = fmt(Math.round(cu.v)); } }, 1.8);

        // Tarjetas en cascada, listas por tarjeta
        tl.fromTo("#s5-root .c-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, stagger: 0.12, ease: "power3.out" }, 2.4);
        tl.fromTo("#s5-root .k1 li", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "power2.out" }, 2.9);
        tl.fromTo("#s5-root .k2 li", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "power2.out" }, 3.0);
        tl.fromTo("#s5-root .k3 li", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "power2.out" }, 3.1);
        tl.fromTo("#s5-root .k4 li", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "power2.out" }, 3.2);

        // Franja del dashboard: se revela de izquierda a derecha
        tl.fromTo("#s5-root .strip", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power3.out" }, 5.0);
        tl.fromTo("#s5-root .strip .ic", { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.8, ease: "back.out(2)" }, 5.4);

        // Pulso ambiental en la meta
        tl.to("#s5-root .goal", { scale: 1.03, duration: 0.8, yoyo: true, repeat: 2, ease: "sine.inOut", transformOrigin: "50% 50%" }, 6.4);

        tl.fromTo("#s5-root .ft", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 4.0);

        window.__timelines["s5"] = tl;
      </script>
