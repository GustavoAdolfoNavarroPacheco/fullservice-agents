version: 2
updates:
  # Acciones de GitHub usadas por el CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]

  # Vídeos de las presentaciones (HyperFrames)
  - package-ecosystem: npm
    directory: /agents/claude-agents/presentations-designer/videos/giron-cc
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(agents)"
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /agents/claude-agents/presentations-designer/videos/hubux
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(agents)"
    labels: ["dependencies"]
