<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Módulo de Cobranza con IA · Alcaldía Municipal de Girón</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Poppins'; src: url('assets/fonts/Poppins-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Poppins'; src: url('assets/fonts/Poppins-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; }
    @font-face { font-family: 'Poppins'; src: url('assets/fonts/Poppins-SemiBold.ttf') format('truetype'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Poppins'; src: url('assets/fonts/Poppins-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; }
    @font-face { font-family: 'Poppins'; src: url('assets/fonts/Poppins-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; }

    :root {
      --navy: #000087; --violet: #5E3AE2; --gold: #F4B422; --sky: #2CAAFF; --green: #00AA80; --sand: #E4E4DB;
      --ink: #373435; --white: #FFFFFF;
      --sh-card: 0 24px 60px rgba(0, 0, 135, .13), 0 6px 18px rgba(0, 0, 135, .07);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FFFFFF; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #FFFFFF; font-family: 'Poppins', sans-serif; color: var(--ink); }

    /* ---- escena ---- */
    .clip { position: absolute; inset: 0; overflow: hidden; background: transparent; }
    .sc-in { position: absolute; inset: 0; overflow: hidden; background: #FFFFFF; }
    .w-mask { display: block; overflow: hidden; padding-bottom: .16em; margin-bottom: -.16em; }
    .w { display: inline-block; }

    /* ---- marcas compartidas ---- */
    .ghost { position: absolute; top: 58px; right: 110px; font-weight: 900; font-size: 150px; line-height: 1; color: var(--navy); opacity: .07; }
    .h2 { position: absolute; left: 110px; top: 92px; font-weight: 900; font-size: 62px; line-height: 1.08; color: var(--navy); white-space: nowrap; }
    .h2 .mk { color: var(--violet); margin-right: .14em; }
    .h2 .em { color: var(--violet); }
    .ft { position: absolute; left: 110px; right: 110px; bottom: 38px; display: flex; justify-content: space-between; align-items: center; font-size: 19px; font-weight: 500; }
    .crumbs { color: var(--navy); opacity: .7; }
    .crumbs i { font-style: normal; color: var(--violet); margin: 0 6px; }
    .lema { color: var(--violet); font-weight: 600; }

    /* ---- tarjetas (sombra, sin bordes) ---- */
    .card { position: absolute; background: #FFFFFF; border-radius: 26px; box-shadow: var(--sh-card); overflow: hidden; }
    .card.navy { background: var(--navy); color: #FFFFFF; }
    .card.violet { background: var(--violet); color: #FFFFFF; }
    .card.gold { background: var(--gold); color: var(--navy); }
    .card h3, .card h4 { font-weight: 900; color: var(--navy); line-height: 1.1; }
    .card.navy h3, .card.navy h4, .card.violet h3, .card.violet h4 { color: #FFFFFF; }
    .card.gold h3, .card.gold h4 { color: var(--navy); }
    .arcs { position: absolute; right: -74px; top: -74px; width: 230px; height: 230px; color: var(--violet); opacity: .22; overflow: visible; }
    .card.navy .arcs, .card.violet .arcs { color: #FFFFFF; opacity: .18; }
    .arcs circle { fill: none; stroke: currentColor; stroke-width: 2; }
    .arcs .dash { stroke-dasharray: 6 14; }

    /* ---- listas ---- */
    .list { list-style: none; }
    .list li { position: relative; padding-left: 30px; font-size: 21px; line-height: 1.42; margin-bottom: 12px; }
    .list li::before { content: ""; position: absolute; left: 0; top: .56em; width: 11px; height: 11px; border-radius: 50%; background: var(--green); }
    .card.navy .list li::before, .card.violet .list li::before { background: var(--gold); }
    .nb { display: inline-block; margin-left: 10px; padding: 4px 12px; border-radius: 99px; background: var(--gold); color: var(--navy); font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; }
    .nb.aj { background: #E9E4FD; color: var(--navy); }
    .card.navy .nb, .card.violet .nb { background: var(--gold); color: var(--navy); }

    /* ---- íconos ---- */
    .ic { flex: none; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; }
    .ic svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ic--sm { width: 60px; height: 60px; border-radius: 18px; }
    .ic--sm svg { width: 32px; height: 32px; }
    .ic--violet { background: var(--violet); color: #FFFFFF; }
    .ic--sky { background: var(--sky); color: #FFFFFF; }
    .ic--gold { background: var(--gold); color: var(--navy); }
    .ic--green { background: var(--green); color: #FFFFFF; }
    .ic--navy { background: var(--navy); color: #FFFFFF; }
    .tag { font-size: 17px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
  </style>
</head>
