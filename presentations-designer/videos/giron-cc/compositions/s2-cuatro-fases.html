        // Transición de entrada: iris circular con anillo dorado que se expande

        // Titular por palabras y numeral fantasma

        tl.fromTo("#s2-root .ghost", { opacity: 0, x: 60 }, { opacity: 0.07, x: 0, duration: 1.2, ease: "power2.out" }, 0.4);

        // Cuatro tarjetas en flip 3D

        // Números que aparecen con rebote
        tl.fromTo("#s2-root .cnum", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, stagger: 0.14, ease: "back.out(2)" }, 1.1);

        // Textos de cada tarjeta en cascada
        tl.fromTo("#s2-root .c-card h4, #s2-root .c-card p", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.06, ease: "power2.out" }, 1.3);

        // Anillos de esquina girando
        tl.fromTo("#s2-root .arcs .dash", { rotation: 0 }, { rotation: 360, duration: 9, ease: "none", svgOrigin: "115 115" }, 0.6);

        // Franja transversal y pie

        tl.fromTo("#s2-root .strip .ic", { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.8, ease: "back.out(2)" }, 3.0);
        tl.fromTo("#s2-root .ft", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 3.0);
