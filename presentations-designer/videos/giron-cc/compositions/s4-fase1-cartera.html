        const tl = gsap.timeline({ paused: true });
        const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

        // Transición de entrada: barrido vertical de abajo hacia arriba con barra violeta
        tl.fromTo("#s4-in", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.inOut" }, 0);

        tl.to("#s4-wbar", { opacity: 0, duration: 0.2, ease: "none" }, 0.8);

        // Titular por palabras
        tl.fromTo("#s4-root .h2 .w", { yPercent: 115 }, { yPercent: 0, duration: 0.8, stagger: 0.1, ease: "power4.out" }, 0.4);
        tl.fromTo("#s4-root .ghost", { opacity: 0, x: 60 }, { opacity: 0.07, x: 0, duration: 1.2, ease: "power2.out" }, 0.45);

        // Tarjetas que suben con escala

        // Listas: una por tarjeta, en cascada
        tl.fromTo("#s4-root .n1 li", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: "power2.out" }, 1.1);
        tl.fromTo("#s4-root .n2 li", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: "power2.out" }, 1.22);
        tl.fromTo("#s4-root .n3 li", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: "power2.out" }, 1.34);

        // Gráfico del dashboard: las barras crecen desde la base
        tl.fromTo("#s4-root .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.7, stagger: 0.08, ease: "power3.out", transformOrigin: "50% 100%" }, 1.2);

        // Asistente: burbujas que se extienden
        tl.fromTo("#s4-root .pill", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, stagger: 0.2, ease: "power2.out", transformOrigin: "0% 50%" }, 1.6);

        // Franja: se revela de izquierda a derecha y el contador sube hasta 7.000

        const cnt = { v: 0 };
        tl.fromTo(cnt, { v: 0 }, { v: 7000, duration: 1.8, ease: "power2.out", onUpdate: () => { document.getElementById("s4-num").textContent = fmt(Math.round(cnt.v)); } }, 2.8);

        // Anillos de esquina girando
        tl.fromTo("#s4-root .arcs .dash", { rotation: 0 }, { rotation: 360, duration: 9, ease: "none", svgOrigin: "115 115" }, 0.8);

        tl.fromTo("#s4-root .ft", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 3.0);

        window.__timelines["s4"] = tl;
